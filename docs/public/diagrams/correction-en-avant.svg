<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Correction en avant : si la version 1.5 ne démarre pas, rien n&#x27;a été écrit et le retour automatique à 1.4 est sûr ; si elle a fonctionné puis pose problème, on publie 1.5.1 ; revenir à 1.4 serait dangereux, car elle ne lit pas les données écrites par 1.5" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Correction en avant : si la version 1.5 ne démarre pas, rien n&#x27;a été écrit et le retour automatique à 1.4 est sûr ; si elle a fonctionné puis pose problème, on publie 1.5.1 ; revenir à 1.4 serait dangereux, car elle ne lit pas les données écrites par 1.5</title>
<rect x="0" y="0" width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ne revenir en arrière qu&#x27;avant toute écriture</text>
<rect x="30" y="110" width="170" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="115.0" y="144.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1.5 installée</text>
<rect x="250" y="50" width="230" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="365.0" y="74.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Ne démarre pas</text>
<text x="365.0" y="91.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">rien n&#x27;a été écrit</text>
<rect x="530" y="50" width="260" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="660.0" y="82.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Retour automatique à 1.4</text>
<rect x="250" y="170" width="230" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="365.0" y="194.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">A fonctionné,</text>
<text x="365.0" y="211.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">puis pose problème</text>
<rect x="530" y="170" width="260" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="660.0" y="202.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Correction en avant : 1.5.1</text>
<rect x="250" y="260" width="540" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="520.0" y="289.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Revenir à 1.4 : elle ne lit pas les données écrites par 1.5</text>
<line x1="202.0" y1="118.4" x2="248.0" y2="107.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="202.0" y1="160.2" x2="248.0" y2="170.9" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="482.0" y1="78.0" x2="528.0" y2="78.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="482.0" y1="198.0" x2="528.0" y2="198.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
