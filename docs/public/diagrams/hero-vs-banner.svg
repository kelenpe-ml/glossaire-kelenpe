<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero section vs Banner" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Hero section vs Banner</title>
<rect x="0" y="0" width="620" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<text x="310" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Hero section (haut de page, 1re impression)</text>
<rect x="40" y="40" width="540" height="140" rx="12" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<rect x="70" y="65" width="230" height="20" rx="4" fill="#93c5fd" opacity="1"  />
<rect x="70" y="95" width="340" height="14" rx="4" fill="#bfdbfe" opacity="1"  />
<rect x="70" y="120" width="120" height="30" rx="6" fill="#2563eb" opacity="1"  />
<text x="130" y="140" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="white" >CTA</text>
<rect x="400" y="65" width="150" height="90" rx="8" fill="#93c5fd" opacity="1"  />
<text x="310" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Banner (bloc promo, ailleurs sur la page)</text>
<rect x="140" y="225" width="340" height="90" rx="10" fill="#fef3c7" opacity="1" stroke="#d97706" stroke-width="1.25" />
<text x="310" y="260" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >-30% sur la selection du mois</text>
<text x="310" y="285" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#64748b" >bandeau large, message ponctuel</text>
<text x="310" y="355" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b" >Le Hero vend la page ; le Banner pousse une offre</text>
</svg>