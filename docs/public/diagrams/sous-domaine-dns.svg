<svg viewBox="0 0 820 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sous-domaine et enregistrement DNS : le navigateur demande au DNS l&#x27;adresse de apiprodora.kelenpe.com ; un enregistrement A renvoie l&#x27;adresse IP du serveur ; sur le serveur, le proxy de Coolify aiguille la requête vers le bon conteneur selon le nom demandé" font-family="ui-sans-serif,system-ui,sans-serif">
