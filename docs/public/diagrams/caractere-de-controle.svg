<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caractère de contrôle : le dernier caractère d&#x27;une référence est calculé à partir des autres, ce qui détecte une faute de frappe ; un code tapé par blocs vérifie chaque bloc et dit lequel contient l&#x27;erreur" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Caractère de contrôle : le dernier caractère d&#x27;une référence est calculé à partir des autres, ce qui détecte une faute de frappe ; un code tapé par blocs vérifie chaque bloc et dit lequel contient l&#x27;erreur</title>
<rect x="0" y="0" width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Une référence qui se vérifie elle-même</text>
<text x="30" y="166" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Code tapé en blocs de 5 caractères</text>
<text x="600" y="212" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">« Le bloc 3 contient</text>
<text x="600" y="230" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">une erreur »</text>
<text x="30" y="290" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">On sait où corriger au lieu de tout retaper ; la faute est vue avant tout envoi.</text>
<rect x="30" y="60" width="150" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105.0" y="89.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">BTK-7K4</text>
<rect x="190" y="60" width="80" height="50" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="230.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">M</text>
<text x="230.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">contrôle</text>
<rect x="330" y="60" width="210" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="435.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ BTK-7K4M</text>
<text x="435.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">M recalculé = M saisi</text>
<rect x="560" y="60" width="230" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="675.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ BTK-7K4N</text>
<text x="675.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">faute de frappe détectée</text>
<rect x="30" y="190" width="120" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="90.0" y="219.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Bloc 1 ✓</text>
<rect x="170" y="190" width="120" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="230.0" y="219.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Bloc 2 ✓</text>
<rect x="310" y="190" width="120" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="370.0" y="219.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Bloc 3 ✗</text>
<rect x="450" y="190" width="120" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="510.0" y="219.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Bloc 4</text>
<line x1="272.0" y1="85.0" x2="328.0" y2="85.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
