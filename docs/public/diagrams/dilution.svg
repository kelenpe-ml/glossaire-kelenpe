<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dilution — avant / apres levee" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Dilution — avant / apres levee</title>
<rect x="0" y="0" width="680" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<text x="160" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Avant (1000 actions)</text>
<rect x="60" y="50" width="200" height="40" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="160" y="75" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#1e293b" >Fondateur : 800 (80%)</text>
<rect x="60" y="95" width="50" height="30" rx="6" fill="#e2e8f0" opacity="1" stroke="#94a3b8" stroke-width="1.25" />
<text x="85" y="115" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" >200</text>
<text x="85" y="145" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="400" fill="#64748b" >Autres associes (20%)</text>
<text x="520" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Apres (1250 actions)</text>
<rect x="420" y="50" width="160" height="40" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="500" y="75" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#1e293b" >Fondateur : 800 (64%)</text>
<rect x="420" y="95" width="40" height="30" rx="6" fill="#e2e8f0" opacity="1" stroke="#94a3b8" stroke-width="1.25" />
<rect x="465" y="95" width="100" height="30" rx="6" fill="#fef3c7" opacity="1" stroke="#d97706" stroke-width="1.25" />
<text x="515" y="115" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#64748b" >250 nouvelles (investisseur, 20%)</text>
<line x1="280" y1="90" x2="400" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="340.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">levee de fonds</text>
<text x="340" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b" >Le fondateur garde ses 800 actions, mais son % baisse de 80% a 64%</text>
</svg>