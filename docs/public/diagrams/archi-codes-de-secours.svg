<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Codes de secours : une série générée est montrée une fois et gardée hachée ; à la récupération, le code passe une attente croissante puis une comparaison, et rend l&#x27;accès en étant consommé" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Codes de secours : une série générée est montrée une fois et gardée hachée ; à la récupération, le code passe une attente croissante puis une comparaison, et rend l&#x27;accès en étant consommé</title>
<rect x="0" y="0" width="820" height="420" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Création</text>
<text x="30" y="224" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Récupération, sans internet</text>
<text x="570" y="72" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Un code ne sert qu&#x27;une fois.</text>
<text x="570" y="90" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">La série se renouvelle</text>
<text x="570" y="108" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">avec le mot de passe.</text>
<rect x="30" y="80" width="190" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="125.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Série de codes</text>
<text x="125.0" y="125.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">tirée au hasard</text>
<rect x="290" y="50" width="250" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="415.0" y="74.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Montrée une seule fois</text>
<text x="415.0" y="91.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">à noter sur papier</text>
<rect x="290" y="122" width="250" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="415.0" y="146.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Gardée hachée</text>
<text x="415.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">comme un mot de passe</text>
<rect x="30" y="240" width="160" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Code saisi</text>
<text x="110.0" y="285.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">compte oublié</text>
<rect x="220" y="240" width="170" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="305.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Attente croissante</text>
<text x="305.0" y="285.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">après plusieurs échecs</text>
<rect x="420" y="240" width="170" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="505.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Comparaison</text>
<text x="505.0" y="285.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">aux empreintes</text>
<rect x="620" y="240" width="170" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="705.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Accès rendu</text>
<text x="705.0" y="285.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">code consommé</text>
<rect x="30" y="340" width="340" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="200.0" y="372.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Tous les codes perdus</text>
<rect x="430" y="340" width="360" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="610.0" y="364.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Recours hors ligne</text>
<text x="610.0" y="381.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">code signé par l&#x27;éditeur</text>
<line x1="222.0" y1="100.6" x2="288.0" y2="92.9" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="222.0" y1="124.7" x2="288.0" y2="133.4" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="192.0" y1="272.0" x2="218.0" y2="272.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="392.0" y1="272.0" x2="418.0" y2="272.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="592.0" y1="272.0" x2="618.0" y2="272.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="437.1" y1="180.0" x2="479.9" y2="238.0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fleche)"/>
<line x1="372.0" y1="368.0" x2="428.0" y2="368.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
