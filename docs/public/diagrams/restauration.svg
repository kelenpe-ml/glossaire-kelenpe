<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Restauration : tout vérifier avant d’écrire" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Restauration : tout vérifier avant d’écrire</title>
<rect x="0" y="0" width="820" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="25" y="60" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="95.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Fichier</text>
<text x="95.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">choisi</text>
<line x1="165" y1="90" x2="185" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="185" y="60" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="255.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Secret</text>
<text x="255.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">ouvre la clé</text>
<line x1="325" y1="90" x2="345" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="345" y="60" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="415.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Vérification</text>
<text x="415.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">chaque objet</text>
<line x1="485" y1="90" x2="505" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="505" y="60" width="140" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="575.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Résumé</text>
<text x="575.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">confirmation</text>
<line x1="645" y1="90" x2="665" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="665" y="60" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="735.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Écriture</text>
<text x="735.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">puis contrôle</text>
<rect x="185" y="150" width="290" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="330.0" y="169.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Secret faux, octet modifié</text>
<text x="330.0" y="186.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">refus : la base n’est pas touchée</text>
<line x1="255" y1="120" x2="300" y2="150" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="640" y="158" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Journal réinséré, listes recalculées,</text>
<text x="640" y="176" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">comparées à la copie ; nouveau poste.</text>
<text x="410" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Rien n’est écrit avant « Restaurer » ; une boutique déjà là est mise de côté, jamais effacée.</text>
</svg>
