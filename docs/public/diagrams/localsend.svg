<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LocalSend : envoi d’un fichier au téléphone sur le Wi-Fi" font-family="ui-sans-serif,system-ui,sans-serif">
<title>LocalSend : envoi d’un fichier au téléphone sur le Wi-Fi</title>
<rect x="0" y="0" width="820" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="40" y="60" width="170" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="125.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Boutik (PC)</text>
<text x="125.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">émetteur</text>
<rect x="610" y="60" width="170" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="695.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Téléphone</text>
<text x="695.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">application LocalSend</text>
<line x1="210" y1="72" x2="610" y2="72" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="410.0" y="65.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">1. qui est là ? (multicast 224.0.0.167:53317)</text>
<line x1="610" y1="104" x2="210" y2="104" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="410.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">2. « Téléphone d’Awa », empreinte</text>
<line x1="210" y1="150" x2="610" y2="150" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="410.0" y="143.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">3. prepare-upload : 1 fichier, 3 Mo</text>
<rect x="560" y="170" width="220" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="670.0" y="189.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Accepter ?</text>
<text x="670.0" y="206.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">le commerçant touche Accepter</text>
<line x1="610" y1="230" x2="210" y2="230" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="410.0" y="223.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">4. accepté → upload (HTTPS)</text>
<text x="410" y="266" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Aucun Internet, aucun serveur : les deux appareils sur le même Wi-Fi ou le partage de connexion.</text>
</svg>
