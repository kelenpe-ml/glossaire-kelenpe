<line x1="382.0" y1="102.0" x2="408.0" y2="102.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="582.0" y1="102.0" x2="608.0" y2="102.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="460.2" y1="146.0" x2="363.7" y2="268.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="528.7" y1="146.0" x2="622.0" y2="268.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
