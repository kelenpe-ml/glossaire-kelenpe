<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vérification sous Windows sans PC Windows : le poste Linux pousse une branche de vérification ; la CI lance des machines Windows qui construisent, installent et testent ; vert, on fusionne ; rouge, on corrige" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Vérification sous Windows sans PC Windows : le poste Linux pousse une branche de vérification ; la CI lance des machines Windows qui construisent, installent et testent ; vert, on fusionne ; rouge, on corrige</title>
<rect x="0" y="0" width="820" height="420" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">La CI tient lieu de PC Windows</text>
<rect x="30" y="70" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Poste de dev</text>
<text x="105.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Linux</text>
<rect x="210" y="70" width="170" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="295.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Branche</text>
<text x="295.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">de vérification</text>
<rect x="410" y="60" width="170" height="84" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="495.0" y="89.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">CI</text>
<text x="495.0" y="106.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">machines Windows</text>
<text x="495.0" y="123.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">neuves à chaque fois</text>
<rect x="610" y="40" width="180" height="124" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="700.0" y="72.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Jobs Windows</text>
<text x="700.0" y="89.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">construire, tests</text>
<text x="700.0" y="106.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">installer en silence</text>
<text x="700.0" y="123.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">e2e sur l&#x27;interface</text>
<text x="700.0" y="140.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">jobs ciblés</text>
<rect x="210" y="270" width="260" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="340.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Vert : fusion</text>
<text x="340.0" y="311.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">sur la branche principale</text>
<rect x="500" y="270" width="290" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="645.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Rouge : corriger</text>
<text x="645.0" y="311.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">journaux recueillis</text>
<rect x="30" y="352" width="760" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="379.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Liste écrite de ce qu&#x27;aucune machine ne vérifie (matériel réel, usage réel)</text>
