<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sauvegarde chiffrée sans serveur : une copie cohérente est préparée à part, chiffrée par une clé que des enveloppes ouvrent, déposée sur des destinations, et restaurée après vérification complète" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Sauvegarde chiffrée sans serveur : une copie cohérente est préparée à part, chiffrée par une clé que des enveloppes ouvrent, déposée sur des destinations, et restaurée après vérification complète</title>
<rect x="0" y="0" width="820" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Copier, chiffrer, déposer</text>
<text x="30" y="300" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Restaurer</text>
<text x="30" y="222" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Garder N copies,</text>
<text x="30" y="240" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">rappeler si aucune.</text>
<rect x="30" y="60" width="120" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="90.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Base</text>
<text x="90.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">en service</text>
<rect x="180" y="60" width="190" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="275.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Préparation à part</text>
<text x="275.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">instantané cohérent</text>
<rect x="400" y="60" width="180" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="490.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Copie chiffrée</text>
<text x="490.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">objets par empreinte</text>
<rect x="620" y="36" width="170" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="705.0" y="62.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Téléphone (câble)</text>
<rect x="620" y="90" width="170" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="705.0" y="116.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Stockage en ligne</text>
<rect x="620" y="144" width="170" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="705.0" y="170.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Application mobile</text>
<rect x="180" y="206" width="190" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="275.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Enveloppes</text>
<text x="275.0" y="249.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">mot de passe, codes</text>
<rect x="400" y="206" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="490.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Clé de sauvegarde</text>
<text x="490.0" y="249.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">jamais dans la copie</text>
<rect x="30" y="318" width="170" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="350.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Copie choisie</text>
<rect x="225" y="318" width="175" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="312.5" y="342.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Tout vérifier</text>
<text x="312.5" y="359.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">avant d&#x27;écrire</text>
<rect x="425" y="318" width="175" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="512.5" y="350.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Base neuve à part</text>
<rect x="625" y="318" width="165" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="707.5" y="342.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Bascule</text>
<text x="707.5" y="359.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">reprise si coupure</text>
