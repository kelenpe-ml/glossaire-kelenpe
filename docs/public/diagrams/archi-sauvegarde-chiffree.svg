<line x1="582.0" y1="123.7" x2="635.3" y2="142.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="372.0" y1="236.0" x2="398.0" y2="236.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="359.2" y="188.0" width="51.6" height="17" rx="4" fill="#f8fafc"/>
<text x="385" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">ouvrent</text>
<line x1="490.0" y1="204.0" x2="490.0" y2="126.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="464.2" y="157.0" width="51.6" height="17" rx="4" fill="#f8fafc"/>
<text x="490.0" y="169.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">chiffre</text>
<line x1="202.0" y1="346.0" x2="223.0" y2="346.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="402.0" y1="346.0" x2="423.0" y2="346.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="602.0" y1="346.0" x2="623.0" y2="346.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
