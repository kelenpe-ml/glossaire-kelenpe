<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ladder ABR — renditions et bitrate" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Ladder ABR — renditions et bitrate</title>
<rect x="0" y="0" width="760" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect x="60" y="220" width="100" height="40" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="110" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >1080p</text>
<text x="110" y="275" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#64748b" >5000 kbps</text>
<rect x="220" y="160" width="100" height="100" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="270" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >720p</text>
<text x="270" y="275" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#64748b" >2800 kbps</text>
<rect x="380" y="100" width="100" height="160" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="430" y="90" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >480p</text>
<text x="430" y="275" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#64748b" >1400 kbps</text>
<rect x="540" y="50" width="100" height="210" rx="6" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="590" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >360p</text>
<text x="590" y="275" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" fill="#64748b" >800 kbps</text>
<line x1="50" y1="260" x2="700" y2="260" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="400" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" >Le lecteur choisit la rendition selon la bande passante disponible (ABR)</text>
<line x1="160" y1="60" x2="300" y2="100" stroke="#d97706" stroke-width="1.75" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
<text x="230.0" y="72.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">reseau degrade -&gt; qualite baisse</text>
<line x1="500" y1="100" x2="620" y2="60" stroke="#16a34a" stroke-width="1.75" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
<text x="560.0" y="72.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">reseau ok -&gt; qualite remonte</text>
</svg>