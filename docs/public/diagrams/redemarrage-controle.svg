<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Redémarrage contrôlé après une erreur grave" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Redémarrage contrôlé après une erreur grave</title>
<rect x="0" y="0" width="820" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="30" y="40" width="180" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="120.0" y="67.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Erreur non rattrapée</text>
<text x="120.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">processus principal</text>
<line x1="210" y1="70" x2="240" y2="70" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="240" y="40" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="320.0" y="67.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Journal</text>
<text x="320.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">l’erreur est écrite</text>
<line x1="400" y1="70" x2="430" y2="70" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="430" y="30" width="360" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="610.0" y="58.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Message à l’écran</text>
<text x="610.0" y="75.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">« Un problème est survenu. Nous vous</text>
<text x="610.0" y="89.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">conseillons de redémarrer Boutik. »</text>
<line x1="615" y1="106" x2="615" y2="140" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="623" y="127.0" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Redémarrer</text>
<rect x="500" y="140" width="230" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="615.0" y="173.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ticket ou saisie en cours ?</text>
<line x1="500" y1="168" x2="380" y2="168" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="440.0" y="161.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">oui</text>
<rect x="170" y="140" width="210" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="275.0" y="165.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">« Redémarrer Boutik ? »</text>
<text x="275.0" y="182.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">confirmation habituelle</text>
<line x1="275" y1="196" x2="275" y2="240" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="283" y="222.0" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Rester</text>
<rect x="170" y="240" width="210" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="275.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Rien ne change</text>
<text x="275.0" y="279.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">ticket gardé</text>
<line x1="615" y1="196" x2="615" y2="240" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="623" y="222.0" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">non, ou « quand même »</text>
<rect x="500" y="240" width="230" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="615.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Fermeture puis relance</text>
<text x="615.0" y="279.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">nouveau démarrage au journal</text>
<text x="30" y="120" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">3 erreurs en 10 min : message insistant,</text>
<text x="30" y="134" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">puis bandeau qui reste.</text>
</svg>
