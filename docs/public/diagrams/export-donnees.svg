<svg viewBox="0 0 820 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Export de données : tout exporter (patron) ou la liste d&#x27;un écran avec ses filtres ; le processus principal vérifie le droit, un processus séparé fabrique un classeur, une archive de CSV ou un CSV ; ces canaux ne sont jamais bloqués par la licence" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Export de données : tout exporter (patron) ou la liste d&#x27;un écran avec ses filtres ; le processus principal vérifie le droit, un processus séparé fabrique un classeur, une archive de CSV ou un CSV ; ces canaux ne sont jamais bloqués par la licence</title>
