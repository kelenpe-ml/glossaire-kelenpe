<text x="565.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Processus séparé</text>
<text x="565.0" y="133.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">lit, fabrique</text>
<rect x="680" y="36" width="110" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
