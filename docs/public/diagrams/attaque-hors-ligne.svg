<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Attaque en ligne et attaque hors ligne" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Attaque en ligne et attaque hors ligne</title>
<rect x="0" y="0" width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="205" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">En ligne : sur l’écran de Boutik</text>
<text x="615" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Hors ligne : sur une copie volée</text>
<line x1="410" y1="50" x2="410" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30" y="70" width="150" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="105.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Voleur</text>
<text x="105.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">tape des essais</text>
<rect x="230" y="70" width="150" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="305.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Boutik</text>
<text x="305.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">contrôle chaque essai</text>
<line x1="180" y1="98" x2="230" y2="98" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="130" y="170" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="205.0" y="195.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Attente croissante</text>
<text x="205.0" y="212.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">30 s, 60 s, 2 min…</text>
<line x1="305" y1="126" x2="230" y2="170" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="205" y="256" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Quelques essais par heure :</text>
<text x="205" y="274" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">un mot de passe moyen tient.</text>
<rect x="440" y="70" width="150" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="515.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Voleur</text>
<text x="515.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">copie sur son PC</text>
<rect x="640" y="70" width="150" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="715.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Copie .boutik</text>
<text x="715.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">enveloppe argon2id</text>
<line x1="590" y1="98" x2="640" y2="98" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="540" y="170" width="150" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="615.0" y="195.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Aucune attente</text>
<text x="615.0" y="212.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">des millions d’essais</text>
<line x1="715" y1="126" x2="640" y2="170" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="615" y="256" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Seuls la lenteur d’argon2id et la solidité</text>
<text x="615" y="274" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">du mot de passe protègent la copie.</text>
</svg>
