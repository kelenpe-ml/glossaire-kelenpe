<svg viewBox="0 0 820 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code de demande et réponse à usage unique : Boutik tire un nonce, le garde comme demande en attente et l&#x27;envoie dans le code ; Kelenpe signe une réponse qui reprend ce nonce ; Boutik ne l&#x27;accepte que si la demande est en attente, puis la clôt : le même code est ensuite refusé" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Code de demande et réponse à usage unique : Boutik tire un nonce, le garde comme demande en attente et l&#x27;envoie dans le code ; Kelenpe signe une réponse qui reprend ce nonce ; Boutik ne l&#x27;accepte que si la demande est en attente, puis la clôt : le même code est ensuite refusé</title>
<rect x="0" y="0" width="820" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Sans internet : la demande part, la réponse revient signée</text>
<rect x="30" y="60" width="220" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="140.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Boutik tire un nonce</text>
<text x="140.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">demande gardée « en attente »</text>
<line x1="252" y1="91" x2="292" y2="91" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="295" y="60" width="230" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Code de demande (WhatsApp)</text>
<text x="410.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">boutique, empreinte, nonce</text>
<line x1="527" y1="91" x2="567" y2="91" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="570" y="60" width="220" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="680.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Kelenpe signe la réponse</text>
<text x="680.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">qui reprend le même nonce</text>
<line x1="680" y1="124" x2="680" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="460" y="162" width="330" height="62" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="625.0" y="189.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Boutik vérifie la réponse</text>
<text x="625.0" y="206.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">signature, poste, type, nonce en attente</text>
<line x1="458" y1="193" x2="300" y2="193" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="30" y="162" width="268" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="164.0" y="189.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Acceptée : la demande est close</text>
<text x="164.0" y="206.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">dans la même opération</text>
<text x="30" y="262" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Le même code une deuxième fois</text>
<rect x="30" y="280" width="330" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="195.0" y="302.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Refusé</text>
<text x="195.0" y="319.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">plus aucune demande en attente</text>
<text x="380" y="300" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Les demandes en attente ne sont jamais copiées par la sauvegarde :</text>
<text x="380" y="318" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">restaurer une copie ne rouvre aucune demande close.</text>
</svg>
