<svg viewBox="0 0 820 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isolation par instantané : lire pendant qu’on écrit" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Isolation par instantané : lire pendant qu’on écrit</title>
<rect x="0" y="0" width="820" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="30" y="60" width="180" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="120.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Copie</text>
<text x="120.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">commence sa lecture</text>
<rect x="30" y="170" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="120.0" y="197.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Caisse</text>
<text x="120.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">enregistre une vente</text>
<rect x="300" y="60" width="220" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="410.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Instantané</text>
<text x="410.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">la base telle qu’à 10:00:00</text>
<line x1="210" y1="90" x2="300" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="255.0" y="83.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">10:00:00</text>
<rect x="300" y="170" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="197.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Base en service</text>
<text x="410.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vente ajoutée à 10:00:01</text>
<line x1="210" y1="200" x2="300" y2="200" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="255.0" y="193.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">10:00:01</text>
<rect x="600" y="60" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="695.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Copie cohérente</text>
<text x="695.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">sans cette vente</text>
<line x1="520" y1="90" x2="600" y2="90" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="600" y="170" width="190" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="695.0" y="197.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Copie suivante</text>
<text x="695.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">avec cette vente</text>
<line x1="520" y1="200" x2="600" y2="200" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="410" y="256" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">Jamais à moitié : la vente est entière dans une copie, ou absente ; personne n’attend personne.</text>
</svg>
