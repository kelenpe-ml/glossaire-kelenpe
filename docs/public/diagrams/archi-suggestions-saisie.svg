<svg viewBox="0 0 820 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Suggestions de saisie : le début tapé est cherché dans les termes mémorisés et dans les données ; un terme n&#x27;est mémorisé qu&#x27;après une commande réussie, jamais un secret ni un nombre" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Suggestions de saisie : le début tapé est cherché dans les termes mémorisés et dans les données ; un terme n&#x27;est mémorisé qu&#x27;après une commande réussie, jamais un secret ni un nombre</title>
<rect x="0" y="0" width="820" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Proposer ce qu&#x27;on a déjà saisi</text>
<text x="30" y="208" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Mémoriser</text>
<text x="30" y="322" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Préférences du poste, hors journal : le patron peut les effacer vraiment.</text>
<rect x="30" y="60" width="160" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Champ</text>
<text x="110.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">début tapé</text>
<rect x="225" y="60" width="180" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="315.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Recherche</text>
<text x="315.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">sans accents ni casse</text>
<rect x="440" y="104" width="170" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="525.0" y="134.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Termes mémorisés</text>
<rect x="440" y="40" width="170" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="525.0" y="70.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Données existantes</text>
<rect x="645" y="60" width="145" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="717.5" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Liste classée</text>
<text x="717.5" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">fréquence, récence</text>
<rect x="30" y="226" width="190" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="125.0" y="254.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Commande réussie</text>
<text x="125.0" y="271.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vérifiée par le serveur</text>
<rect x="260" y="226" width="200" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="360.0" y="254.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Filtre</text>
<text x="360.0" y="271.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">ni secret, ni nombre</text>
<rect x="500" y="226" width="170" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="585.0" y="254.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Terme ajouté</text>
<text x="585.0" y="271.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">préférence du poste</text>
<line x1="192.0" y1="92.0" x2="223.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="407.0" y1="108.6" x2="438.0" y2="114.3" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="407.0" y1="80.6" x2="438.0" y2="76.8" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="612.0" y1="112.8" x2="643.0" y2="106.7" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="612.0" y1="77.8" x2="643.0" y2="81.9" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="222.0" y1="258.0" x2="258.0" y2="258.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="462.0" y1="258.0" x2="498.0" y2="258.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="569.1" y1="224.0" x2="538.1" y2="158.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
