<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De Boutik au téléphone sous Linux : gio, GVfs, gvfs-mtp" font-family="ui-sans-serif,system-ui,sans-serif">
<title>De Boutik au téléphone sous Linux : gio, GVfs, gvfs-mtp</title>
<rect x="0" y="0" width="820" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="20" y="70" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="90.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Boutik</text>
<text x="90.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">gio copy …</text>
<line x1="160" y1="100" x2="180" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="180" y="70" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="250.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">gio</text>
<text x="250.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">commande</text>
<line x1="320" y1="100" x2="340" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="340" y="70" width="140" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="410.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">GVfs</text>
<text x="410.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">service de session</text>
<line x1="480" y1="100" x2="500" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="500" y="70" width="140" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="570.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">gvfs-mtp</text>
<text x="570.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">parle MTP (libmtp)</text>
<line x1="640" y1="100" x2="660" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="660" y="70" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="730.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Téléphone</text>
<text x="730.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Transfert de fichiers</text>
<text x="410" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">Sans gvfs et gvfs-mtp, gio ne voit aucun téléphone : « gio mount -li » ne liste rien.</text>
<text x="410" y="192" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le bus D-Bus de la session démarre GVfs à la demande ; udev donne l’accès USB à l’utilisateur connecté.</text>
</svg>
