<rect x="640" y="140" width="150" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="715.0" y="160.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ 2 sur 3</text>
<text x="715.0" y="177.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">même ordinateur</text>
