<rect x="490" y="220" width="130" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="555.0" y="248.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Disque Z</text>
<rect x="640" y="220" width="150" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="715.0" y="240.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ 0 sur 3</text>
<text x="715.0" y="257.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">autre : transfert</text>
