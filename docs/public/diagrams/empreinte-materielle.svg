<text x="410.0" y="88.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Processeur B</text>
<rect x="490" y="60" width="130" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="555.0" y="88.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Disque C</text>
<rect x="640" y="60" width="150" height="48" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="715.0" y="88.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Empreinte connue</text>
<rect x="200" y="140" width="130" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="265.0" y="168.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Carte mère A</text>
<rect x="345" y="140" width="130" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="168.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Processeur B</text>
<rect x="490" y="140" width="130" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
