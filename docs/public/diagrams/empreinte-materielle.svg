<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Empreinte matérielle tolérante : carte mère, processeur et disque ; si le disque seul est remplacé, deux pièces sur trois concordent et c&#x27;est le même ordinateur ; si toutes changent, c&#x27;est un autre ordinateur ; seul un résumé brouillé quitte l&#x27;ordinateur" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Empreinte matérielle tolérante : carte mère, processeur et disque ; si le disque seul est remplacé, deux pièces sur trois concordent et c&#x27;est le même ordinateur ; si toutes changent, c&#x27;est un autre ordinateur ; seul un résumé brouillé quitte l&#x27;ordinateur</title>
<rect x="0" y="0" width="820" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Reconnu tant que la majorité des pièces est la même</text>
<text x="30" y="89" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Au départ</text>
<text x="30" y="169" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Disque remplacé</text>
<text x="30" y="249" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Autre ordinateur</text>
<text x="30" y="312" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Seul un résumé brouillé, non réversible, quitte l&#x27;ordinateur.</text>
<rect x="200" y="60" width="130" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
