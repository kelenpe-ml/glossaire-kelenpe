<svg viewBox="0 0 820 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chiffrement authentifié : un octet changé, la copie est refusée" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Chiffrement authentifié : un octet changé, la copie est refusée</title>
<rect x="0" y="0" width="820" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="30" y="60" width="150" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="105.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Données</text>
<text x="105.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">journal, photos</text>
<rect x="30" y="150" width="150" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="105.0" y="175.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Clé secrète</text>
<text x="105.0" y="192.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">32 octets</text>
<line x1="180" y1="88" x2="300" y2="110" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<line x1="180" y1="178" x2="300" y2="130" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="300" y="90" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="375.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">AES-256-GCM</text>
<text x="375.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">chiffre et signe</text>
<line x1="450" y1="120" x2="520" y2="120" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="520" y="70" width="130" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="585.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">chiffré</text>
<rect x="660" y="70" width="130" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="725.0" y="89.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">étiquette</text>
<text x="725.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">16 octets</text>
<rect x="520" y="150" width="270" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="655.0" y="169.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Lecture : étiquette juste</text>
<text x="655.0" y="186.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">données rendues</text>
<rect x="520" y="214" width="270" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="655.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Un seul octet modifié</text>
<text x="655.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">refus, rien n’est rendu</text>
<text x="240" y="250" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">L’étiquette dépend de chaque octet :</text>
<text x="240" y="268" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">impossible de la refaire sans la clé.</text>
</svg>
