<svg viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminaison TLS au reverse proxy" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Terminaison TLS au reverse proxy</title>
<rect x="0" y="0" width="820" height="240" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="30" y="80" width="150" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="105.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Navigateur</text>
<text x="105.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">cadenas HTTPS</text>
<line x1="180" y1="110" x2="330" y2="110" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="255.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">chiffré (HTTPS)</text>
<rect x="330" y="70" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="415.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Reverse proxy</text>
<text x="415.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">déchiffre ici</text>
<text x="415.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">certificat + clé</text>
<line x1="500" y1="110" x2="640" y2="110" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="570.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">réseau interne</text>
<rect x="640" y="80" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="715.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Application</text>
<text x="715.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">ne gère pas TLS</text>
<text x="410" y="190" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Un seul endroit détient le certificat et le renouvelle ; les applications derrière restent simples.</text>
<text x="410" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le trafic interne peut être rechiffré si le réseau n’est pas de confiance.</text>
</svg>
