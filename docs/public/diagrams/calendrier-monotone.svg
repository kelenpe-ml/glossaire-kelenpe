<text x="715.0" y="89.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">21 février</text>
<rect x="650" y="160" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
