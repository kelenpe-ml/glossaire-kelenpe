<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Calendrier monotone : l&#x27;horloge de l&#x27;ordinateur est reculée du 2 mars au 20 février ; le calendrier de l&#x27;application ignore le recul, reste au 2 mars, puis continue d&#x27;avancer au rythme du temps écoulé" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Calendrier monotone : l&#x27;horloge de l&#x27;ordinateur est reculée du 2 mars au 20 février ; le calendrier de l&#x27;application ignore le recul, reste au 2 mars, puis continue d&#x27;avancer au rythme du temps écoulé</title>
<rect x="0" y="0" width="820" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Un calendrier qui ne recule jamais</text>
<text x="30" y="90" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Horloge de l&#x27;ordinateur</text>
<text x="30" y="190" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Calendrier de l&#x27;application</text>
<text x="30" y="250" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le recul est ignoré ; le temps réellement écoulé (un jour) continue de compter.</text>
<rect x="200" y="60" width="130" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="265.0" y="89.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1er mars</text>
