<rect x="350" y="160" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="415.0" y="189.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">2 mars</text>
<rect x="500" y="60" width="130" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="565.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">20 février</text>
<text x="565.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">reculée ✗</text>
<rect x="500" y="160" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="565.0" y="181.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">2 mars</text>
<text x="565.0" y="198.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">recul ignoré</text>
