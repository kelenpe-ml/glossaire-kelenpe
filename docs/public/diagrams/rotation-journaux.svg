<svg viewBox="0 0 820 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rotation des journaux : 5 fichiers de 1 Mo au plus" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Rotation des journaux : 5 fichiers de 1 Mo au plus</title>
<rect x="0" y="0" width="820" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="410" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">boutik.log plein (1 Mo) : chaque fichier recule d’un rang, le plus ancien disparaît</text>
<rect x="25" y="60" width="130" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="90.0" y="85.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.log</text>
<text x="90.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">le plus récent</text>
<line x1="155" y1="88" x2="175" y2="88" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="175" y="60" width="130" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="240.0" y="85.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.1.log</text>
<text x="240.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b"> </text>
<line x1="305" y1="88" x2="325" y2="88" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="325" y="60" width="130" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="390.0" y="85.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.2.log</text>
<text x="390.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b"> </text>
<line x1="455" y1="88" x2="475" y2="88" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="475" y="60" width="130" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="540.0" y="85.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.3.log</text>
<text x="540.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b"> </text>
<line x1="605" y1="88" x2="625" y2="88" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="625" y="60" width="130" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="690.0" y="85.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.4.log</text>
<text x="690.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">le plus ancien</text>
<line x1="690" y1="116" x2="690" y2="150" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="655" y="150" width="70" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="690.0" y="175.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">✕</text>
<text x="735" y="175" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#dc2626">supprimé</text>
<text x="300" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le journal ne dépasse jamais 5 × 1 Mo,</text>
<text x="300" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">même après des milliers d’erreurs.</text>
</svg>
