<svg viewBox="0 0 820 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retour à la version précédente : copie, installation, puis contrôle du démarrage ; si la nouvelle version ne démarre pas, l&#x27;ancienne est relancée" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Retour à la version précédente : copie, installation, puis contrôle du démarrage ; si la nouvelle version ne démarre pas, l&#x27;ancienne est relancée</title>
<rect x="0" y="0" width="820" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Une mise à jour ratée ne laisse jamais le poste sans logiciel</text>
<rect x="30" y="70" width="140" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Version 1</text>
<text x="100.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">en service</text>
<rect x="200" y="70" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="275.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Copie</text>
<text x="275.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">données, version 1</text>
<rect x="380" y="70" width="150" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="455.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Version 2</text>
<text x="455.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">installée</text>
<rect x="560" y="70" width="230" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="675.0" y="104.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Démarre dans le délai ?</text>
<rect x="560" y="186" width="230" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="675.0" y="217.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Oui : version 2 gardée</text>
<rect x="30" y="186" width="500" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="280.0" y="217.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Non : version 1 relancée, copie disponible</text>
<line x1="172.0" y1="100.0" x2="198.0" y2="100.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="352.0" y1="100.0" x2="378.0" y2="100.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="532.0" y1="100.0" x2="558.0" y2="100.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="675.0" y1="132.0" x2="675.0" y2="184.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="563.1" y1="132.0" x2="381.4" y2="184.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
