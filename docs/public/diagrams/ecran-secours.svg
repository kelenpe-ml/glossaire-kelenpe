<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Écran de secours : un écran plante, le reste de Boutik reste utilisable" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Écran de secours : un écran plante, le reste de Boutik reste utilisable</title>
<rect x="0" y="0" width="820" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="40" y="40" width="740" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="40" width="740" height="40" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="95" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#6366f1">Accueil</text>
<text x="200" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#6366f1">Vendre</text>
<text x="305" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#6366f1">Créances</text>
<text x="410" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Stock</text>
<text x="515" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#6366f1">Historique</text>
<text x="690" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#16a34a">✔ navigation gardée</text>
<rect x="170" y="100" width="480" height="125" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="410" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">⚠ Un problème est survenu sur cet écran</text>
<text x="410" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le reste de Boutik fonctionne.</text>
<rect x="265" y="168" width="170" height="36" rx="8" fill="#6366f1"/>
<text x="350" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Recharger l’écran</text>
<rect x="450" y="168" width="110" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="505" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Accueil</text>
<text x="460" y="96" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#dc2626">écran Stock planté</text>
<text x="410" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">L’erreur part au journal ; un autre écran s’ouvre normalement (chaque écran a son propre secours).</text>
</svg>
