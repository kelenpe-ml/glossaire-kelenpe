<svg viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Journal de retour arrière et journal WAL" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Journal de retour arrière et journal WAL</title>
<rect x="0" y="0" width="820" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="205" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Journal de retour arrière (avant)</text>
<text x="615" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Journal WAL (Boutik aujourd’hui)</text>
<line x1="410" y1="50" x2="410" y2="310" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30" y="70" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="110.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Transaction</text>
<text x="110.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">une vente</text>
<rect x="230" y="70" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="310.0" y="97.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.db-journal</text>
<text x="310.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">anciennes pages</text>
<line x1="190" y1="100" x2="230" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="130" y="180" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="210.0" y="207.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.db</text>
<text x="210.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">pages réécrites</text>
<line x1="300" y1="130" x2="250" y2="180" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="205" y="270" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">À chaque transaction : fichier créé,</text>
<text x="205" y="286" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">écrit sur le disque puis effacé.</text>
<text x="205" y="304" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">Coûteux sous Windows.</text>
<rect x="440" y="70" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="520.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Transaction</text>
<text x="520.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">une vente</text>
<rect x="630" y="70" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="710.0" y="97.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.db-wal</text>
<text x="710.0" y="114.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">écrite à la suite</text>
<line x1="600" y1="100" x2="630" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="630" y="180" width="160" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="710.0" y="207.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.db</text>
<text x="710.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">mise à jour plus tard</text>
<line x1="710" y1="130" x2="710" y2="180" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="718" y="159.0" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">report</text>
<rect x="440" y="180" width="160" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="520.0" y="207.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">boutik.db-shm</text>
<text x="520.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">index des pages</text>
<text x="615" y="270" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Une seule écriture sur le disque par transaction ;</text>
<text x="615" y="286" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">le fichier reste là, pages chiffrées.</text>
<text x="615" y="304" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">Une vente : 44,7 ms → 11,7 ms (CI Windows)</text>
</svg>
