<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abonnement et achat définitif : l&#x27;abonnement s&#x27;arrête s&#x27;il n&#x27;est pas renouvelé ; l&#x27;achat définitif fonctionne pour toujours, avec un an de mises à jour compris, puis un forfait annuel facultatif ; sans forfait, la version reste figée, avec les corrections de sécurité pendant deux ans" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Abonnement et achat définitif : l&#x27;abonnement s&#x27;arrête s&#x27;il n&#x27;est pas renouvelé ; l&#x27;achat définitif fonctionne pour toujours, avec un an de mises à jour compris, puis un forfait annuel facultatif ; sans forfait, la version reste figée, avec les corrections de sécurité pendant deux ans</title>
<rect x="0" y="0" width="820" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Abonnement : payé chaque année</text>
<rect x="30" y="56" width="230" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="145.0" y="78.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Année 1 payée</text>
<text x="145.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">mises à jour comprises</text>
<line x1="262" y1="82" x2="292" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="295" y="56" width="230" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="410.0" y="78.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Année 2 payée</text>
<text x="410.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">mises à jour comprises</text>
<line x1="527" y1="82" x2="557" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="560" y="56" width="230" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="675.0" y="78.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Pas renouvelé</text>
<text x="675.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">grâce, puis lecture seule</text>
<text x="30" y="150" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Achat définitif : payé une fois (licence perpétuelle)</text>
<rect x="30" y="170" width="230" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="145.0" y="192.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Achat</text>
<text x="145.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">1 an de mises à jour compris</text>
<line x1="262" y1="196" x2="292" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="295" y="170" width="230" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="410.0" y="192.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Forfait annuel payé</text>
<text x="410.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">mises à jour continuent</text>
<line x1="527" y1="196" x2="557" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="560" y="170" width="230" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="675.0" y="192.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Forfait non payé</text>
<text x="675.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">version figée, elle marche</text>
<rect x="295" y="250" width="495" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="542.5" y="269.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Version figée : corrections de sécurité</text>
<text x="542.5" y="286.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">pendant 2 ans après l&#x27;achat, puis plus rien</text>
<text x="30" y="330" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Dans les deux cas les données restent au commerçant ; seul l&#x27;achat définitif ne mène jamais à la lecture seule.</text>
</svg>
