<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Séparation développement / production : un même code, un indicateur fixé à la compilation ; le build de dev garde outils et données à part, celui de production n&#x27;en contient aucun" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Séparation développement / production : un même code, un indicateur fixé à la compilation ; le build de dev garde outils et données à part, celui de production n&#x27;en contient aucun</title>
<rect x="0" y="0" width="820" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Les deux ne se touchent jamais : ni mêmes outils, ni mêmes données</text>
<rect x="30" y="130" width="150" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105.0" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Code source</text>
<text x="105.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">un seul</text>
<rect x="220" y="130" width="190" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="315.0" y="153.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Indicateur</text>
<text x="315.0" y="170.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">fixé à la compilation</text>
<text x="315.0" y="187.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vrai en dev, faux sinon</text>
<rect x="460" y="50" width="330" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="625.0" y="85.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Build de développement</text>
<text x="625.0" y="102.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">outils de test, pannes simulées</text>
<text x="625.0" y="119.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">dossier de données à part</text>
<rect x="460" y="186" width="330" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="625.0" y="221.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Build de production</text>
<text x="625.0" y="238.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">outils retirés du fichier livré</text>
<text x="625.0" y="255.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vraies données du client</text>
<rect x="30" y="310" width="760" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="338.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Vérification : chercher les noms des outils de dev dans l&#x27;exécutable livré → aucun</text>
<line x1="182.0" y1="166.0" x2="218.0" y2="166.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="412.0" y1="144.7" x2="458.0" y2="134.6" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="412.0" y1="187.3" x2="458.0" y2="197.4" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
