<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vecteur de référence : un fichier fige des entrées et les sorties attendues à l&#x27;octet près ; Boutik et le backoffice le vérifient chacun dans ses tests ; si l&#x27;un des deux change le format sans l&#x27;autre, ses tests échouent" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Vecteur de référence : un fichier fige des entrées et les sorties attendues à l&#x27;octet près ; Boutik et le backoffice le vérifient chacun dans ses tests ; si l&#x27;un des deux change le format sans l&#x27;autre, ses tests échouent</title>
<rect x="0" y="0" width="820" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Un même fichier, vérifié des deux côtés</text>
<rect x="30" y="58" width="360" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="210.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Vecteurs de référence</text>
<text x="210.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">entrées, clé de test, sorties attendues</text>
<line x1="392" y1="89" x2="428" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="392" y1="89" x2="428" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="430" y="40" width="360" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="610.0" y="65.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Tests de Boutik</text>
<text x="610.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">refont chaque sortie, relisent</text>
<rect x="430" y="120" width="360" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="610.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Tests du backoffice</text>
<text x="610.0" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">refont chaque sortie, relisent</text>
<rect x="30" y="210" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="210.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Un côté change le format</text>
<text x="210.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">seul, par erreur</text>
<line x1="392" y1="239" x2="428" y2="239" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="430" y="210" width="360" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="610.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Ses tests échouent</text>
<text x="610.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">avant d&#x27;avoir bloqué une boutique</text>
<text x="30" y="310" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Ed25519 est déterministe : la même entrée donne toujours la même signature.</text>
</svg>
