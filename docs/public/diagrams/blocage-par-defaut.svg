<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blocage par défaut : chaque canal est cherché dans une table ; lecture et toujours permis passent, travail est bloqué en lecture seule, et un canal absent de la table est bloqué comme du travail ; un test vérifie que tout canal y figure" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Blocage par défaut : chaque canal est cherché dans une table ; lecture et toujours permis passent, travail est bloqué en lecture seule, et un canal absent de la table est bloqué comme du travail ; un test vérifie que tout canal y figure</title>
<rect x="0" y="0" width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="26" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ce qui n&#x27;est pas autorisé est interdit</text>
<rect x="30" y="110" width="160" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110.0" y="146.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Canal appelé</text>
<rect x="240" y="110" width="170" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="325.0" y="146.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Table des catégories</text>
<rect x="460" y="36" width="330" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="625.0" y="64.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Lecture, toujours permis : passe</text>
<rect x="460" y="102" width="330" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="625.0" y="130.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Travail : bloqué en lecture seule</text>
<rect x="460" y="168" width="330" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="625.0" y="196.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Absent de la table : bloqué aussi</text>
<rect x="30" y="236" width="760" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="262.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Un test vérifie que chaque canal enregistré a sa catégorie</text>
<line x1="192.0" y1="142.0" x2="238.0" y2="142.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="412.0" y1="118.2" x2="529.9" y2="86.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="412.0" y1="137.4" x2="458.0" y2="134.9" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="412.0" y1="156.5" x2="469.0" y2="166.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
