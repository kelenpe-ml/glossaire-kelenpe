<svg viewBox="0 0 820 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Focus itinérant dans la grille des photos d’un lot" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Focus itinérant dans la grille des photos d’un lot</title>
<rect x="0" y="0" width="820" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="360" y="44" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">valeur de tabindex de chaque vignette</text>
<rect x="200" y="60" width="85" height="75" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="242.5" y="94.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">0</text>
<text x="242.5" y="111.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">reçoit Tab</text>
