<text x="442.5" y="197.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">−1</text>
<rect x="500" y="155" width="85" height="75" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="542.5" y="197.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" fill="#1e293b">−1</text>
<line x1="30" y1="97" x2="198" y2="97" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="114.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Tab entre</text>
<text x="600" y="110" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#1e293b">← ↑ → ↓ : vignette voisine</text>
<text x="600" y="130" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#1e293b">Début / Fin : première, dernière</text>
<text x="600" y="150" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#1e293b">Espace : bascule ; Entrée : ouvre</text>
<line x1="600" y1="200" x2="790" y2="200" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="695.0" y="193.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Tab ressort d’un coup</text>
<text x="410" y="272" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Une seule vignette reçoit Tab ; les flèches déplacent ce « seul élément ».</text>
