<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chaque programme reçoit une copie des variables d'environnement de celui qui le lance ; env retire ou ajoute une variable pour la seule commande lancée" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Variables d’environnement transmises au programme lancé</title>
<rect x="0" y="0" width="820" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Chaque programme reçoit une copie des variables de celui qui le lance</text>
<rect x="30" y="56" width="175" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="117.5" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">VSCode</text>
<text x="117.5" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#dc2626">ELECTRON_RUN_AS_NODE</text>
<text x="117.5" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">posée par VSCode</text>
<line x1="205" y1="96" x2="223" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="225" y="56" width="175" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="312.5" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Terminal intégré</text>
<text x="312.5" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">en hérite : Electron</text>
<text x="312.5" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">tournerait comme Node ✗</text>
<line x1="400" y1="96" x2="418" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="420" y="56" width="175" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="507.5" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">env</text>
<text x="507.5" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">-u : retire la variable</text>
<text x="507.5" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">NOM=valeur : en ajoute une</text>
<line x1="595" y1="96" x2="613" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="615" y="56" width="175" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="702.5" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Boutik (Electron)</text>
<text x="702.5" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">XDG_CONFIG_HOME :</text>
<text x="702.5" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">base dans un dossier d’essai</text>
<text x="30" y="170" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">env -u ELECTRON_RUN_AS_NODE XDG_CONFIG_HOME=$BOUTIK_ESSAI npm run dev</text>
<text x="30" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le changement ne vaut que pour cette commande : le terminal garde ses variables.</text>
<rect x="30" y="200" width="370" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="215" y="232" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">export (variable ordinaire)</text>
<text x="215" y="254" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vue seulement dans ce terminal</text>
<text x="215" y="272" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">et les programmes qu’il lance</text>
<rect x="420" y="200" width="370" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="605" y="232" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">✓ set -Ux (fish, universelle)</text>
<text x="605" y="254" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">vue par tous les terminaux fish,</text>
<text x="605" y="272" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">même ceux déjà ouverts</text>
</svg>
