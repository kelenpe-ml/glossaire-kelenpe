<text x="665.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1.5</text>
<text x="665.0" y="101.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">nouveautés</text>
<rect x="170" y="170" width="200" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="270.0" y="194.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1.4.1</text>
<text x="270.0" y="211.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">correction simple</text>
