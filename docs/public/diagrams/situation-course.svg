<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Situation de course : un délai fixe au lieu d’un signe de fin" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Situation de course : un délai fixe au lieu d’un signe de fin</title>
<rect x="0" y="0" width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="50" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Machine rapide : le fichier est lu en 150 ms</text>
<line x1="30" y1="80" x2="790" y2="80" stroke="#64748b" stroke-width="1.5"/>
<line x1="30.0" y1="75" x2="30.0" y2="85" stroke="#64748b" stroke-width="1.5"/>
<text x="30.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">0 ms</text>
<line x1="300.0" y1="75" x2="300.0" y2="85" stroke="#64748b" stroke-width="1.5"/>
<text x="300.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">300 ms</text>
<line x1="750.0" y1="75" x2="750.0" y2="85" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">800 ms</text>
<circle cx="165.0" cy="80" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.75"/>
<text x="165.0" y="68" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#16a34a">aperçu ouvert</text>
<circle cx="300.0" cy="80" r="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.75"/>
<text x="312.0" y="120" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">à 300 ms, le test vérifie l’aperçu : ✔</text>
<text x="30" y="170" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Machine chargée : le fichier est lu en 800 ms</text>
<line x1="30" y1="200" x2="790" y2="200" stroke="#64748b" stroke-width="1.5"/>
<line x1="30.0" y1="195" x2="30.0" y2="205" stroke="#64748b" stroke-width="1.5"/>
<text x="30.0" y="220" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">0 ms</text>
<line x1="300.0" y1="195" x2="300.0" y2="205" stroke="#64748b" stroke-width="1.5"/>
<text x="300.0" y="220" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">300 ms</text>
<line x1="750.0" y1="195" x2="750.0" y2="205" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="220" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">800 ms</text>
<circle cx="750.0" cy="200" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.75"/>
<text x="750.0" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#16a34a">aperçu ouvert</text>
<circle cx="300.0" cy="200" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.75"/>
<text x="312.0" y="240" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">à 300 ms, pas d’aperçu → « fichier refusé » : ✖</text>
<text x="410" y="286" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Correction : attendre ce qui doit arriver (l’aperçu prêt), jamais un délai fixe.</text>
</svg>
