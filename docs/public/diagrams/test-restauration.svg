<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Test de restauration d&#x27;une copie : tous les trois mois, chaque copie est ouverte avec la phrase de passe, comparée à la clé publique attendue, puis sert à signer et vérifier un message de test ; une copie qui échoue est remplacée" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Test de restauration d&#x27;une copie : tous les trois mois, chaque copie est ouverte avec la phrase de passe, comparée à la clé publique attendue, puis sert à signer et vérifier un message de test ; une copie qui échoue est remplacée</title>
<rect x="0" y="0" width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Tous les trois mois, pour chaque copie</text>
<rect x="30" y="58" width="170" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="115.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Ouvrir</text>
<text x="115.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">avec la phrase</text>
<line x1="202" y1="89" x2="228" y2="89" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="230" y="58" width="170" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="315.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Comparer</text>
<text x="315.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">à la clé publique</text>
<line x1="402" y1="89" x2="428" y2="89" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="430" y="58" width="170" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="515.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Signer, vérifier</text>
<text x="515.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">un message de test</text>
<line x1="602" y1="89" x2="628" y2="89" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="630" y="58" width="160" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="710.0" y="85.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Copie valide</text>
<text x="710.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">on la range</text>
<rect x="430" y="160" width="360" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="610.0" y="185.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Une étape échoue</text>
<text x="610.0" y="202.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">copie remplacée sans attendre</text>
<line x1="515" y1="122" x2="515" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<text x="30" y="270" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Une copie jamais essayée n&#x27;est qu&#x27;un espoir : mieux vaut découvrir qu&#x27;elle est abîmée avant d&#x27;en avoir besoin.</text>
</svg>
