<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atomicité : l’import de produits, tout ou rien" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Atomicité : l’import de produits, tout ou rien</title>
<rect x="0" y="0" width="820" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="410" y="34" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Toutes les lignes vérifiées d’abord, puis écrites dans une seule transaction</text>
<rect x="30" y="60" width="210" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="135.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Toutes valides</text>
<text x="135.0" y="109.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">une transaction</text>
<line x1="240" y1="95" x2="320" y2="95" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="320" y="60" width="230" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="435.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">500 produits</text>
<text x="435.0" y="109.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">enregistrés ensemble</text>
<rect x="30" y="150" width="210" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="135.0" y="182.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ligne 12 refusée</text>
<text x="135.0" y="199.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">(prix négatif)</text>
<line x1="240" y1="185" x2="320" y2="185" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<rect x="320" y="150" width="230" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="435.0" y="182.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">0 produit</text>
<text x="435.0" y="199.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">« Rien n’a été importé : ligne 12 »</text>
<text x="575" y="110" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Jamais d’import à moitié :</text>
<text x="575" y="130" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">une erreur au milieu annule</text>
<text x="575" y="146" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">toute la transaction.</text>
</svg>
