<svg viewBox="0 0 820 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Encodage canonique : un même contenu de licence donne toujours les mêmes 61 octets ; la signature porte sur ces octets ; toute autre écriture du même contenu est refusée à la lecture" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Encodage canonique : un même contenu de licence donne toujours les mêmes 61 octets ; la signature porte sur ces octets ; toute autre écriture du même contenu est refusée à la lecture</title>
<rect x="0" y="0" width="820" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Un contenu, une seule suite d&#x27;octets</text>
<rect x="30" y="60" width="170" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Contenu</text>
<text x="115.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">boutique, dates, formule</text>
<rect x="250" y="60" width="170" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="335.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">61 octets</text>
<text x="335.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">une seule écriture</text>
<rect x="470" y="60" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="545.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Signature</text>
<text x="545.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">sur ces octets</text>
<rect x="660" y="60" width="130" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="725.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Fichier</text>
<text x="725.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">contenu + signature</text>
<rect x="30" y="190" width="370" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="215.0" y="218.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✓ Relu, réencodé : identique</text>
<text x="215.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">accepté si la signature concorde</text>
<rect x="420" y="190" width="370" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="605.0" y="218.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">✗ Autre écriture du même contenu</text>
<text x="605.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">refusée, même avec les mêmes valeurs</text>
<line x1="202.0" y1="92.0" x2="248.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="422.0" y1="92.0" x2="468.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="622.0" y1="92.0" x2="658.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
</svg>
