<svg viewBox="0 0 820 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cérémonie de clés : l&#x27;outil crée quatre paires sur l&#x27;ordinateur de Drissa, hors réseau ; chaque clé privée est chiffrée par la phrase de passe ; L1 a deux copies hors ligne et un fichier pour le serveur, L2 et U2 seulement deux copies hors ligne, U1 reste sur l&#x27;ordinateur avec deux copies ; seules les clés publiques vont dans Boutik" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Cérémonie de clés : l&#x27;outil crée quatre paires sur l&#x27;ordinateur de Drissa, hors réseau ; chaque clé privée est chiffrée par la phrase de passe ; L1 a deux copies hors ligne et un fichier pour le serveur, L2 et U2 seulement deux copies hors ligne, U1 reste sur l&#x27;ordinateur avec deux copies ; seules les clés publiques vont dans Boutik</title>
<rect x="0" y="0" width="820" height="410" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Une seule fois, sur l&#x27;ordinateur de Drissa, sans réseau</text>
<rect x="30" y="56" width="360" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="210.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Outil des clés</text>
<text x="210.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">4 paires : L1, L2, U1, U2</text>
<line x1="392" y1="85" x2="428" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="430" y="56" width="360" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="610.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Clés privées chiffrées</text>
<text x="610.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">par la phrase de passe (scrypt, AES)</text>
<rect x="30" y="150" width="180" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="120.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">L1</text>
<text x="120.0" y="196.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">2 copies + serveur</text>
<rect x="225" y="150" width="180" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="315.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">L2</text>
<text x="315.0" y="196.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">2 copies hors ligne</text>
<rect x="420" y="150" width="180" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="510.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">U1</text>
<text x="510.0" y="196.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">ordinateur + 2 copies</text>
<rect x="615" y="150" width="175" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="702.5" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">U2</text>
<text x="702.5" y="196.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">2 copies hors ligne</text>
<line x1="610" y1="116" x2="120" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="610" y1="116" x2="315" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="610" y1="116" x2="510" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="610" y1="116" x2="702" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="30" y="252" width="360" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="210.0" y="277.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Clés publiques seulement</text>
<text x="210.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">embarquées dans Boutik</text>
<rect x="430" y="252" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="610.0" y="277.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Phrase de passe</text>
<text x="610.0" y="294.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">gestionnaire + papier, ailleurs</text>
<rect x="30" y="330" width="760" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="410.0" y="349.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Jamais</text>
<text x="410.0" y="366.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">clé privée ou phrase dans un chat, un e-mail, Git ou une session d&#x27;IA</text>
</svg>
