<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compositing par calques (z-index)" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Compositing par calques (z-index)</title>
<rect x="0" y="0" width="500" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect x="90" y="100" width="320" height="90" rx="10" fill="#e2e8f0" opacity="1" stroke="#94a3b8" stroke-width="1.25" />
<text x="250" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Video de fond</text>
<text x="250" y="168" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" >z-index: 0</text>
<rect x="68" y="78" width="320" height="90" rx="10" fill="#fef3c7" opacity="1" stroke="#d97706" stroke-width="1.25" />
<text x="228" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Sticker (cutout)</text>
<text x="228" y="146" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" >z-index: 1</text>
<rect x="46" y="56" width="320" height="90" rx="10" fill="#dbeafe" opacity="1" stroke="#2563eb" stroke-width="1.25" />
<text x="206" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >Texte overlay</text>
<text x="206" y="124" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#64748b" >z-index: 2</text>
<text x="250" y="300" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" >Trie par zIndex croissant, dessine sur un Canvas transparent</text>
</svg>