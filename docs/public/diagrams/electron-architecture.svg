<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture Electron — Boutik" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Architecture Electron — Boutik</title>
<rect x="0" y="0" width="700" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect x="40" y="90" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="125.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Main process</text>
<text x="125.0" y="139.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">Node.js, SQLite, ventes</text>
<rect x="270" y="90" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="350.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Preload</text>
<text x="350.0" y="139.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">pont IPC type</text>
<rect x="490" y="90" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="575.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Renderer</text>
<text x="575.0" y="139.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">React (UI caissier)</text>
<line x1="210" y1="130" x2="270" y2="130" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="240.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">IPC</text>
<line x1="430" y1="130" x2="490" y2="130" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="460.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">API exposee</text>
<line x1="490" y1="150" x2="430" y2="150" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="460.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">invoke()</text>
<line x1="270" y1="150" x2="210" y2="150" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)" />
<text x="350" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748b" >Le Renderer ne touche jamais directement Node/SQLite</text>
</svg>