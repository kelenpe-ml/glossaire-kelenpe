<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Algorithme de Luhn et somme pondérée : en base 31, doubler puis additionner les chiffres donne le même résultat pour 1 et 16, donc une faute passe inaperçue ; une somme pondérée modulo 31 donne des résultats tous différents et repère toute faute d&#x27;un caractère" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Algorithme de Luhn et somme pondérée : en base 31, doubler puis additionner les chiffres donne le même résultat pour 1 et 16, donc une faute passe inaperçue ; une somme pondérée modulo 31 donne des résultats tous différents et repère toute faute d&#x27;un caractère</title>
<rect x="0" y="0" width="820" height="340" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Luhn en base 31 : doubler, puis additionner les « chiffres »</text>
<rect x="30" y="58" width="190" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125.0" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">valeur 1</text>
<text x="125.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">doublée : 2</text>
<rect x="235" y="58" width="265" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="367.5" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">valeur 16</text>
<text x="367.5" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">doublée : 32, soit « 1 1 » → 1 + 1 = 2</text>
<rect x="515" y="58" width="275" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="652.5" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Même résultat : 2</text>
<text x="652.5" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">taper 16 au lieu de 1 passe</text>
<text x="30" y="160" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Somme pondérée modulo 31 (31 est premier)</text>
<rect x="30" y="182" width="400" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="230.0" y="207.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Σ (position × valeur) + contrôle ≡ 0</text>
<text x="230.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">poids 1, 2, 3… tous différents</text>
<line x1="432" y1="211" x2="448" y2="211" stroke="#64748b" stroke-width="1.5" marker-end="url(#fleche)"/>
<rect x="450" y="182" width="340" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="620.0" y="207.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Toute faute d&#x27;un caractère repérée</text>
<text x="620.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">et toute inversion de deux caractères</text>
<text x="30" y="300" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Luhn reste juste en base 10 (cartes bancaires) : c&#x27;est la base impaire qui le rend inadapté ici.</text>
</svg>
