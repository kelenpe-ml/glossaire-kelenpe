<text x="410" y="172" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Automatique de temps en temps et à la fermeture. Après une suppression « réelle »</text>
<text x="410" y="190" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">(image, suggestions), Boutik le demande aussitôt et vide le fichier -wal (TRUNCATE).</text>
