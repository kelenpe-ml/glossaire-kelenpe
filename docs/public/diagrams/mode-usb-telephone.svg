<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recharge seule ou Transfert de fichiers" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Recharge seule ou Transfert de fichiers</title>
<rect x="0" y="0" width="820" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="205" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">« Recharge seulement »</text>
<text x="615" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">« Transfert de fichiers » (MTP)</text>
<line x1="410" y1="50" x2="410" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30" y="80" width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="90.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ordinateur</text>
<rect x="260" y="80" width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="320.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Téléphone</text>
<text x="320.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">se recharge</text>
<line x1="150" y1="110" x2="260" y2="110" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="205.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">courant seul</text>
<text x="205" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">L’ordinateur ne voit aucun fichier :</text>
<text x="205" y="218" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">impossible d’y déposer une copie.</text>
<rect x="440" y="80" width="120" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="500.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Ordinateur</text>
<rect x="670" y="80" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="730.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Téléphone</text>
<text x="730.0" y="124.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">stockage visible</text>
<line x1="560" y1="100" x2="670" y2="100" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="615.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">courant</text>
<line x1="560" y1="124" x2="670" y2="124" stroke="#64748b" stroke-width="1.75" marker-end="url(#fleche)"/>
<text x="615" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">+ fichiers</text>
<text x="615" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Boutik écrit dans le dossier « Boutik »</text>
<text x="615" y="218" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#16a34a">du stockage interne du téléphone.</text>
</svg>
