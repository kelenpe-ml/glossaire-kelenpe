<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quatre branches empilées les unes sur les autres, fusionnées dans main en une seule avance rapide" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Branches empilées fusionnées en une seule avance rapide</title>
<rect x="0" y="0" width="820" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Chaque branche part de la précédente, pas de main</text>
<rect x="30" y="60" width="80" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="70" y="97" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">main</text>
<line x1="110" y1="92" x2="128" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="130" y="60" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="205" y="87" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">feat/detourage-lot</text>
<text x="205" y="105" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">5 commits</text>
<line x1="280" y1="92" x2="298" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="300" y="60" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="375" y="87" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">feat/journal-erreurs</text>
<text x="375" y="105" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">+ 6 commits</text>
<line x1="450" y1="92" x2="468" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="470" y="60" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="545" y="87" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">feat/sauvegarde</text>
<text x="545" y="105" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">+ 9 commits</text>
<line x1="620" y1="92" x2="638" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="640" y="60" width="150" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="715" y="87" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">feat/sauvegarde-cable</text>
<text x="715" y="105" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">+ 14 commits</text>
<text x="410" y="158" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">La dernière contient toutes les autres : 5 + 6 + 9 + 14 = 34 commits absents de main.</text>
<rect x="30" y="190" width="370" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="215" y="222" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">✓ Une seule fusion</text>
<text x="215" y="244" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">main avance d’un coup jusqu’à la dernière branche</text>
<rect x="420" y="190" width="370" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="605" y="222" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">✗ Tout attend la dernière</text>
<text x="605" y="244" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">un correctif en bas oblige à rebaser tout le haut</text>
</svg>
