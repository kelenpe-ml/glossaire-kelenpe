<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chiffrement des données locales : une clé aléatoire chiffre la base ; le coffre du système protège la clé ; sans la session de l&#x27;utilisateur, un disque volé reste illisible ; les secrets des comptes sont hachés" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Chiffrement des données locales : une clé aléatoire chiffre la base ; le coffre du système protège la clé ; sans la session de l&#x27;utilisateur, un disque volé reste illisible ; les secrets des comptes sont hachés</title>
<rect x="0" y="0" width="820" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Protéger ce qui est sur le disque, « au repos »</text>
<rect x="30" y="60" width="170" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Tirage au hasard</text>
<text x="115.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">générateur sûr</text>
<rect x="250" y="60" width="170" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="335.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Clé de la base</text>
<text x="335.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">256 bits</text>
<rect x="470" y="60" width="320" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="630.0" y="88.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Coffre du système</text>
<text x="630.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">protège la clé ; seule la session l&#x27;ouvre</text>
<rect x="250" y="186" width="170" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="335.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Base chiffrée</text>
<text x="335.0" y="231.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">chaque page du fichier</text>
<rect x="470" y="186" width="320" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="630.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Disque volé, fichier copié</text>
<text x="630.0" y="231.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">✗ sans la session : rien de lisible</text>
<rect x="30" y="300" width="760" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="322.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Secrets des comptes (mots de passe, PIN)</text>
<text x="410.0" y="339.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">hachés : ni déchiffrables, ni relisibles</text>
<line x1="202.0" y1="92.0" x2="248.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="422.0" y1="92.0" x2="468.0" y2="92.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="422.2" y="42.0" width="45.6" height="17" rx="4" fill="#f8fafc"/>
<text x="445" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">rangée</text>
<line x1="335.0" y1="126.0" x2="335.0" y2="184.0" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="309.2" y="147.0" width="51.6" height="17" rx="4" fill="#f8fafc"/>
<text x="335.0" y="159.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">chiffre</text>
<line x1="468.0" y1="218.0" x2="422.0" y2="218.0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fleche)"/>
</svg>
