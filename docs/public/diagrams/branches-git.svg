<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avance rapide, refus non-fast-forward et poussée forcée prudente" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Avance rapide, refus non-fast-forward et poussée forcée prudente</title>
<rect x="0" y="0" width="820" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">1. Avance rapide (--ff-only)</text>
<circle cx="60" cy="70" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="60" y="74.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">A</text>
<line x1="74" y1="70" x2="101" y2="70" stroke="#64748b" stroke-width="2"/>
<circle cx="115" cy="70" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="115" y="74.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">B</text>
<line x1="129" y1="70" x2="156" y2="70" stroke="#64748b" stroke-width="2"/>
<circle cx="170" cy="70" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.75"/>
<text x="170" y="74.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">C</text>
<line x1="184" y1="70" x2="211" y2="70" stroke="#64748b" stroke-width="2"/>
<circle cx="225" cy="70" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.75"/>
<text x="225" y="74.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">D</text>
<text x="290" y="66" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">main pointait sur B, la branche ajoute C et D :</text>
<text x="290" y="82" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">main avance jusqu’à D, sans commit de fusion.</text>
<text x="30" y="136" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">2. Refus non-fast-forward</text>
<text x="30" y="169" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">distant</text>
<circle cx="110" cy="165" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="110" y="169.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">A</text>
<line x1="124" y1="165" x2="151" y2="165" stroke="#64748b" stroke-width="2"/>
<circle cx="165" cy="165" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="165" y="169.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">B</text>
<line x1="179" y1="165" x2="206" y2="165" stroke="#64748b" stroke-width="2"/>
<circle cx="220" cy="165" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.75"/>
<text x="220" y="169.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">X</text>
<text x="30" y="209" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">local</text>
<circle cx="110" cy="205" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="110" y="209.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">A</text>
<line x1="124" y1="205" x2="151" y2="205" stroke="#64748b" stroke-width="2"/>
<circle cx="165" cy="205" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.75"/>
<text x="165" y="209.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">B</text>
<line x1="179" y1="205" x2="206" y2="205" stroke="#64748b" stroke-width="2"/>
<circle cx="220" cy="205" r="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.75"/>
<text x="220" y="209.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">C</text>
<text x="290" y="180" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#64748b">Le distant a X, que le local n’a pas : accepter le push</text>
<text x="290" y="196" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#dc2626">effacerait X → refusé. On récupère X d’abord.</text>
<text x="30" y="256" text-anchor="start" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">3. Poussée forcée prudente (--force-with-lease)</text>
<rect x="30" y="276" width="340" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="200.0" y="313.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Le distant est encore où je l’ai vu</text>
<text x="200.0" y="330.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">→ remplacé par ma version</text>
<rect x="400" y="276" width="390" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="595.0" y="313.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1e293b">Quelqu’un a poussé entre-temps</text>
<text x="595.0" y="330.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">→ refus : rien n’est écrasé (contrairement à --force)</text>
</svg>
