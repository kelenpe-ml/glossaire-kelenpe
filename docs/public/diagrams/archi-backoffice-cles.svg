<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backoffice et clés de signature : le backoffice signe les licences avec une clé du serveur et journalise ; la clé des mises à jour reste sur l&#x27;ordinateur de l&#x27;éditeur ; clé de réserve et copies chiffrées sont hors ligne" font-family="ui-sans-serif,system-ui,sans-serif">
