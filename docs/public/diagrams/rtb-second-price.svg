<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Enchere au second prix (RTB)" font-family="ui-sans-serif,system-ui,sans-serif">
<title>Enchere au second prix (RTB)</title>
<rect x="0" y="0" width="700" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<text x="350" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b" >3 annonceurs encherissent pour un meme espace pub</text>
<rect x="60" y="70" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="170.0" y="94.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Annonceur A</text>
<text x="170.0" y="109.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">150 FCFA</text>
<rect x="60" y="150" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="170.0" y="174.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Annonceur B</text>
<text x="170.0" y="189.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">120 FCFA</text>
<rect x="60" y="230" width="220" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="170.0" y="254.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Annonceur C</text>
<text x="170.0" y="269.3" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">90 FCFA</text>
<path d="M 300 100 L 420 100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440" y="70" width="220" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="550.0" y="129.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e293b">Gagnant : Annonceur A</text>
<text x="550.0" y="143.1" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#64748b">paie 120 FCFA + 0,01\n(prix de B, pas 150)</text>
<text x="560" y="250" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" >Encourage a encherir sa vraie valorisation</text>
</svg>